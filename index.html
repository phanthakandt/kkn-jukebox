const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function extractVideoId(raw) {
  if (!raw) return null;
  const url = raw.trim();
  if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
  const pats = [
    /[?&]v=([a-zA-Z0-9_-]{11})/, /youtu\.be\/([a-zA-Z0-9_-]{11})/,
    /\/embed\/([a-zA-Z0-9_-]{11})/, /\/shorts\/([a-zA-Z0-9_-]{11})/,
    /\/live\/([a-zA-Z0-9_-]{11})/, /\/v\/([a-zA-Z0-9_-]{11})/,
  ];
  for (const p of pats) { const m = url.match(p); if (m) return m[1]; }
  return null;
}
const thumb = (id) => "https://i.ytimg.com/vi/" + id + "/hqdefault.jpg";
const initials = (n) => (n || "?").trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
const normQueue = (q) => Array.isArray(q) ? q : (q ? Object.values(q) : []);

async function fetchTitle(videoId) {
  const url = "https://www.youtube.com/watch?v=" + videoId;
  const eps = [
    "https://noembed.com/embed?url=" + encodeURIComponent(url),
    "https://www.youtube.com/oembed?url=" + encodeURIComponent(url) + "&format=json",
  ];
  for (const ep of eps) {
    try { const r = await fetch(ep); if (r.ok) { const j = await r.json(); if (j && j.title) return j.title; } } catch (e) {}
  }
  return null;
}
function decodeHtml(str) {
  if (!str) return str;
  const el = document.createElement("textarea");
  el.innerHTML = str;
  return el.value;
}
async function searchYouTube(query) {
  if (!YOUTUBE_API_KEY || !query.trim()) return [];
  const url = "https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=8&q="
    + encodeURIComponent(query.trim()) + "&key=" + YOUTUBE_API_KEY;
  try {
    const r = await fetch(url);
    if (!r.ok) return [];
    const j = await r.json();
    return (j.items || [])
      .filter((it) => it.id && it.id.videoId)
      .map((it) => {
        const th = it.snippet.thumbnails || {};
        const pic = th.default || th.medium || th.high;
        return {
          videoId: it.id.videoId,
          title: decodeHtml(it.snippet.title),
          channel: decodeHtml(it.snippet.channelTitle),
          thumb: pic ? pic.url : thumb(it.id.videoId),
        };
      });
  } catch (e) { return []; }
}

/* =============================== ROOM =============================== */
function Room({ profile, room }) {
  const stateRef = useRef(db.ref("rooms/" + room + "/state"));
  const [shared, setShared] = useState({ nowPlaying: null, queue: [] });
  const sharedRef = useRef(shared);
  useEffect(() => { sharedRef.current = shared; }, [shared]);

  const [members, setMembers] = useState({});
  const [input, setInput] = useState("");
  const [err, setErr] = useState("");
  const [copied, setCopied] = useState(false);
  const [isPlaying, setIsPlaying] = useState(false);
  const [muted, setMuted] = useState(false);
  const [needsTap, setNeedsTap] = useState(false);
  const [apiFailed, setApiFailed] = useState(false);
  const [results, setResults] = useState([]);
  const [searching, setSearching] = useState(false);

  /* atomic mutate via Firebase transaction */
  const mutate = useCallback((fn) => {
    return stateRef.current.transaction((cur) => {
      const s = cur || { nowPlaying: null, queue: [] };
      s.queue = normQueue(s.queue);
      if (!("nowPlaying" in s)) s.nowPlaying = null;
      const next = fn(s);
      return next === undefined ? undefined : next;
    });
  }, []);

  /* live state listener */
  useEffect(() => {
    const ref = stateRef.current;
    const cb = ref.on("value", (snap) => {
      const v = snap.val() || { nowPlaying: null, queue: [] };
      setShared({ nowPlaying: v.nowPlaying || null, queue: normQueue(v.queue) });
    });
    return () => ref.off("value", cb);
  }, [room]);

  /* presence (auto-remove on disconnect) */
  useEffect(() => {
    const meRef = db.ref("rooms/" + room + "/members/" + profile.id);
    meRef.set({ name: profile.name, lastSeen: serverNow() });
    meRef.onDisconnect().remove();
    const mRef = db.ref("rooms/" + room + "/members");
    const cb = mRef.on("value", (snap) => setMembers(snap.val() || {}));
    const hb = setInterval(() => meRef.update({ lastSeen: serverNow() }), 15000);
    return () => { mRef.off("value", cb); clearInterval(hb); meRef.remove(); meRef.onDisconnect().cancel(); };
  }, [room, profile]);

  /* ------------------------- YouTube player ------------------------- */
  const playerRef = useRef(null);
  const playerHostRef = useRef(null);
  const readyRef = useRef(false);
  const curPlayId = useRef(null);
  const tapTimer = useRef(null);

  const sync = useCallback((force) => {
    const p = playerRef.current;
    if (!p || !readyRef.current) return;
    const np = sharedRef.current.nowPlaying;
    if (!np) {
      if (curPlayId.current !== null) { try { p.stopVideo(); } catch (e) {} curPlayId.current = null; setIsPlaying(false); }
      return;
    }
    if (np.playId !== curPlayId.current || force) {
      curPlayId.current = np.playId;
      const elapsed = Math.max(0, (serverNow() - np.startedAt) / 1000);
      try { p.loadVideoById({ videoId: np.videoId, startSeconds: elapsed }); } catch (e) {}
      setNeedsTap(false);
      clearTimeout(tapTimer.current);
      tapTimer.current = setTimeout(() => {
        try { if (playerRef.current.getPlayerState && playerRef.current.getPlayerState() !== 1) setNeedsTap(true); } catch (e) {}
      }, 1600);
    }
  }, []);

  const advance = useCallback((endedId) => mutate((s) => {
    if (endedId != null && (!s.nowPlaying || s.nowPlaying.playId !== endedId)) return undefined;
    const q = s.queue || [];
    const next = q[0] || null;
    s.nowPlaying = next ? Object.assign({}, next, { startedAt: serverNow() }) : null;
    s.queue = q.slice(1);
    return s;
  }), [mutate]);

  const onState = useCallback((e) => {
    const YT = window.YT; if (!YT) return;
    if (e.data === YT.PlayerState.ENDED) {
      const ended = curPlayId.current;
      setTimeout(() => advance(ended), 250 + Math.random() * 700);
    } else if (e.data === YT.PlayerState.PLAYING) {
      setIsPlaying(true); setNeedsTap(false);
      try {
        const d = playerRef.current.getVideoData();
        const np = sharedRef.current.nowPlaying;
        if (d && d.title && np && !np.title) {
          mutate((s) => {
            if (s.nowPlaying && s.nowPlaying.playId === np.playId && !s.nowPlaying.title) {
              s.nowPlaying = Object.assign({}, s.nowPlaying, { title: d.title }); return s;
            }
            return undefined;
          });
        }
      } catch (e2) {}
    } else if (e.data === YT.PlayerState.PAUSED) {
      setIsPlaying(false);
    }
  }, [advance, mutate]);

  useEffect(() => {
    let cancelled = false;
    const create = () => {
      if (cancelled || playerRef.current) return;
      const host = playerHostRef.current;
      if (!host) return;
      try {
        const mount = document.createElement("div");
        host.appendChild(mount);
        playerRef.current = new window.YT.Player(mount, {
          width: "100%", height: "100%",
          playerVars: { autoplay: 1, playsinline: 1, rel: 0, modestbranding: 1 },
          events: { onReady: () => { readyRef.current = true; sync(true); }, onStateChange: onState },
        });
      } catch (e) { setApiFailed(true); }
    };
    if (window.YT && window.YT.Player) create();
    else {
      const prev = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = () => { prev && prev(); create(); };
      if (!document.getElementById("yt-iframe-api")) {
        const s = document.createElement("script");
        s.id = "yt-iframe-api"; s.src = "https://www.youtube.com/iframe_api";
        document.body.appendChild(s);
      }
    }
    const t = setTimeout(() => { if (!(window.YT && window.YT.Player)) setApiFailed(true); }, 7000);
    return () => { cancelled = true; clearTimeout(t); };
  }, [onState, sync]);

  useEffect(() => { sync(); }, [shared.nowPlaying && shared.nowPlaying.playId, sync]);

  useEffect(() => {
    if (!shared.nowPlaying && shared.queue.length > 0) {
      const t = setTimeout(() => {
        mutate((s) => {
          if (s.nowPlaying || (s.queue || []).length === 0) return undefined;
          const [next, ...rest] = s.queue;
          s.nowPlaying = Object.assign({}, next, { startedAt: serverNow() });
          s.queue = rest; return s;
        });
      }, 300 + Math.random() * 500);
      return () => clearTimeout(t);
    }
  }, [shared.nowPlaying, shared.queue, mutate]);

  /* ---------------------------- actions ---------------------------- */
  const queueVideo = (id, titleGuess) => {
    const song = { playId: uid(), videoId: id, title: titleGuess || null, addedBy: profile.name, addedById: profile.id, addedAt: serverNow() };
    mutate((s) => { s.queue = [...(s.queue || []), song]; return s; });
    if (!titleGuess) {
      fetchTitle(id).then((title) => {
        if (!title) return;
        mutate((s) => {
          let hit = false;
          s.queue = (s.queue || []).map((x) => (x.playId === song.playId && !x.title ? (hit = true, Object.assign({}, x, { title })) : x));
          if (s.nowPlaying && s.nowPlaying.playId === song.playId && !s.nowPlaying.title) { s.nowPlaying = Object.assign({}, s.nowPlaying, { title }); hit = true; }
          return hit ? s : undefined;
        });
      });
    }
  };
  const runSearch = async (query) => {
    if (!YOUTUBE_API_KEY) { setErr("ค้นหาเพลงต้องตั้งค่า YOUTUBE_API_KEY ก่อน (ดูคอมเมนต์บนสุดของโค้ด) หรือวางลิงก์ YouTube แทน"); return; }
    setErr(""); setResults([]); setSearching(true);
    const items = await searchYouTube(query);
    setSearching(false);
    if (!items.length) { setErr("ไม่พบผลลัพธ์ ลองคำค้นอื่นดูนะ"); return; }
    setResults(items);
  };
  const addSong = () => {
    const raw = input.trim();
    if (!raw) return;
    const id = extractVideoId(raw);
    if (id) { queueVideo(id); setInput(""); setErr(""); setResults([]); return; }
    runSearch(raw);
  };
  const addFromResult = (item) => {
    queueVideo(item.videoId, item.title);
    setInput(""); setResults([]); setErr("");
  };
  const removeSong = (playId) => mutate((s) => { s.queue = (s.queue || []).filter((x) => x.playId !== playId); return s; });
  const skip = () => advance(null);
  const togglePlay = () => { const p = playerRef.current; if (!p) return; try { isPlaying ? p.pauseVideo() : (p.playVideo(), setNeedsTap(false)); } catch (e) {} };
  const toggleMute = () => { const p = playerRef.current; if (!p) return; try { muted ? p.unMute() : p.mute(); setMuted(!muted); } catch (e) {} };
  const tapToPlay = () => { try { playerRef.current && playerRef.current.playVideo(); } catch (e) {} setNeedsTap(false); };
  const copyRoom = () => { try { navigator.clipboard.writeText(room.toUpperCase()); } catch (e) {} setCopied(true); setTimeout(() => setCopied(false), 1500); };

  /* ---------------------------- render ---------------------------- */
  const np = shared.nowPlaying;
  const online = Object.values(members).filter((m) => serverNow() - (m.lastSeen || 0) < 30000);
  const elapsedStart = np ? Math.max(0, Math.floor((serverNow() - np.startedAt) / 1000)) : 0;

  return (
    <div style={page}>
      <div style={{ maxWidth: 1080, margin: "0 auto", padding: "20px 18px 40px" }}>
        <header style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap", marginBottom: 22 }}>
          <div style={logoBadge}><Radio size={18} /></div>
          <div style={{ marginRight: "auto" }}>
            <div style={{ fontSize: 12, letterSpacing: 2.5, color: C.muted, textTransform: "uppercase" }}>KKN Jukebox (by.IT)</div>
            <button onClick={copyRoom} style={roomChip}>
              <span style={{ fontWeight: 800, letterSpacing: 2 }}>{room.toUpperCase()}</span>
              {copied ? <CheckI size={14} /> : <Copy size={14} />}
            </button>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <UsersI size={16} />
            <div style={{ display: "flex" }}>
              {online.slice(0, 6).map((m, i) => (
                <div key={i} title={m.name} style={{ ...avatar, marginLeft: i ? -8 : 0 }}>{initials(m.name)}</div>
              ))}
            </div>
            <span style={{ color: C.muted, fontSize: 13, marginLeft: 4 }}>{online.length} ออนไลน์</span>
          </div>
        </header>

        <div style={grid} className="jr-grid">
          {/* now playing */}
          <section style={card}>
            <div style={eyebrow}><EqBars active={isPlaying} /><span>กำลังเล่น</span></div>
            <div style={playerWrap}>
              {np && <div style={{ ...blurBg, backgroundImage: "url(" + thumb(np.videoId) + ")" }} />}
              {!apiFailed && <div ref={playerHostRef} style={{ position: "absolute", inset: 0, borderRadius: 14 }} />}
              {apiFailed && np && (
                <iframe key={np.playId} title="player"
                  style={{ position: "absolute", inset: 0, width: "100%", height: "100%", border: 0, borderRadius: 14 }}
                  src={"https://www.youtube.com/embed/" + np.videoId + "?autoplay=1&start=" + elapsedStart + "&rel=0"}
                  allow="autoplay; encrypted-media; picture-in-picture" allowFullScreen />
              )}
              {!np && (
                <div style={emptyPlayer}>
                  <Music size={34} />
                  <p style={{ color: C.muted, margin: "10px 0 0", fontSize: 14 }}>ยังไม่มีเพลง — วางลิงก์ด้านล่างเพื่อเริ่มเลย</p>
                </div>
              )}
              {needsTap && !apiFailed && np && (
                <button onClick={tapToPlay} style={tapOverlay}>
                  <div style={{ ...logoBadge, width: 56, height: 56 }}><Play size={26} /></div>
                  <span style={{ marginTop: 12, color: C.text, fontSize: 14 }}>แตะเพื่อเล่น</span>
                </button>
              )}
            </div>

            <div style={{ marginTop: 14, minHeight: 44 }}>
              <div style={{ fontSize: 17, fontWeight: 700, color: C.text, lineHeight: 1.3 }}>{np ? (np.title || "เพลง YouTube") : "—"}</div>
              {np && <div style={{ color: C.muted, fontSize: 13, marginTop: 3 }}>เพิ่มโดย {np.addedBy}</div>}
            </div>

            <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 14 }}>
              {!apiFailed && <button onClick={togglePlay} disabled={!np} style={{ ...ctrlBtn, opacity: np ? 1 : 0.4 }}>{isPlaying ? <Pause size={20} /> : <Play size={20} />}</button>}
              <button onClick={skip} disabled={!np} style={{ ...ctrlBtn, opacity: np ? 1 : 0.4 }} title="ข้ามเพลง"><Skip size={20} /></button>
              {!apiFailed && <>
                <button onClick={toggleMute} disabled={!np} style={{ ...ctrlBtnGhost, opacity: np ? 1 : 0.4 }}>{muted ? <VolX size={18} /> : <Vol size={18} />}</button>
                <button onClick={() => sync(true)} disabled={!np} style={{ ...ctrlBtnGhost, opacity: np ? 1 : 0.4 }} title="ซิงก์ให้ตรงกับห้อง"><Refresh size={17} /></button>
              </>}
            </div>

            <div style={{ marginTop: 18 }}>
              <div style={{ display: "flex", gap: 8 }}>
                <input style={{ ...inp, marginTop: 0, flex: 1 }} value={input}
                  onChange={(e) => { setInput(e.target.value); setErr(""); if (results.length) setResults([]); }}
                  onKeyDown={(e) => e.key === "Enter" && addSong()} placeholder="วางลิงก์ YouTube หรือพิมพ์ชื่อเพลงเพื่อค้นหา…" />
                <button onClick={addSong} style={primaryBtn} disabled={searching}>
                  {extractVideoId(input) ? <Plus size={18} /> : <SearchI size={18} />}
                  {extractVideoId(input) ? " เข้าคิว" : " ค้นหา"}
                </button>
              </div>
              {searching && <p style={{ color: C.muted, fontSize: 13, margin: "8px 2px 0" }}>กำลังค้นหา…</p>}
              {err && <p style={{ color: C.accent, fontSize: 13, margin: "8px 2px 0" }}>{err}</p>}
              {results.length > 0 && (
                <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 10, maxHeight: 300, overflowY: "auto" }}>
                  {results.map((r) => (
                    <button key={r.videoId} onClick={() => addFromResult(r)} style={{ ...queueRow, cursor: "pointer", textAlign: "left", width: "100%" }}>
                      <img src={r.thumb} alt="" style={{ width: 54, height: 40, objectFit: "cover", borderRadius: 7, flexShrink: 0 }} />
                      <div style={{ minWidth: 0, flex: 1 }}>
                        <div style={{ fontSize: 14, color: C.text, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{r.title}</div>
                        <div style={{ fontSize: 12, color: C.muted, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{r.channel}</div>
                      </div>
                      <Plus size={16} />
                    </button>
                  ))}
                </div>
              )}
            </div>
          </section>

          {/* queue */}
          <section style={{ ...card, display: "flex", flexDirection: "column" }}>
            <div style={{ ...eyebrow, marginBottom: 14 }}><ListM size={16} /><span>คิวถัดไป · {shared.queue.length}</span></div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8, overflowY: "auto", maxHeight: 460 }}>
              {shared.queue.length === 0 && (
                <div style={{ color: C.muted, fontSize: 14, padding: "24px 6px", textAlign: "center", lineHeight: 1.6 }}>
                  คิวว่างอยู่<br />ช่วยกันวางลิงก์เพลงถัดไปได้เลย
                </div>
              )}
              {shared.queue.map((s, i) => (
                <div key={s.playId} style={queueRow}>
                  <span style={{ color: C.muted, fontSize: 12, width: 18, textAlign: "right", flexShrink: 0 }}>{i + 1}</span>
                  <img src={thumb(s.videoId)} alt="" style={{ width: 54, height: 40, objectFit: "cover", borderRadius: 7, flexShrink: 0 }} />
                  <div style={{ minWidth: 0, flex: 1 }}>
                    <div style={{ fontSize: 14, color: C.text, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{s.title || "เพลง YouTube"}</div>
                    <div style={{ fontSize: 12, color: C.muted }}>{s.addedBy}</div>
                  </div>
                  <button onClick={() => removeSong(s.playId)} style={rowX} title="เอาออกจากคิว"><XIcon size={15} /></button>
                </div>
              ))}
            </div>
          </section>
        </div>

        <p style={{ color: C.muted, fontSize: 12, textAlign: "center", marginTop: 24, lineHeight: 1.6 }}>
          บอกเพื่อนให้เปิดลิงก์นี้แล้วใส่รหัสห้อง <b style={{ color: C.text }}>{room.toUpperCase()}</b> เพื่อเข้าห้องเดียวกัน
        </p>
      </div>
    </div>
  );
}

function EqBars({ active }) {
  return (
    <span style={{ display: "inline-flex", alignItems: "flex-end", gap: 2, height: 14 }}>
      {[0, 1, 2].map((i) => (
        <span key={i} style={{
          width: 3, height: 14, background: C.accent, borderRadius: 2, transformOrigin: "bottom",
          animation: active ? "eq 0.9s " + (i * 0.15) + "s ease-in-out infinite" : "none",
          transform: active ? undefined : "scaleY(0.35)",
        }} />
      ))}
    </span>
  );
}

/* ------------------------------ styles ------------------------------ */
const page = { minHeight: "100vh", background: "radial-gradient(1200px 600px at 20% -10%, #2a1e45 0%, " + C.bg + " 45%, " + C.bg2 + " 100%)", color: C.text };
const logoBadge = { width: 36, height: 36, borderRadius: 12, flexShrink: 0, background: "linear-gradient(135deg, " + C.accent + ", " + C.accent2 + ")", display: "flex", alignItems: "center", justifyContent: "center", color: "#12101d", boxShadow: "0 6px 20px rgba(255,111,97,.35)" };
const grid = { display: "grid", gridTemplateColumns: "1.5fr 1fr", gap: 18 };
const card = { background: C.panel, border: "1px solid " + C.line, borderRadius: 18, padding: 18 };
const eyebrow = { display: "flex", alignItems: "center", gap: 8, color: C.muted, fontSize: 12, letterSpacing: 2, textTransform: "uppercase", marginBottom: 12 };
const playerWrap = { position: "relative", width: "100%", aspectRatio: "16 / 9", background: C.bg2, borderRadius: 14, overflow: "hidden" };
const blurBg = { position: "absolute", inset: -20, backgroundSize: "cover", backgroundPosition: "center", filter: "blur(28px) brightness(0.5)", opacity: 0.5 };
const emptyPlayer = { position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 20, textAlign: "center", color: C.muted };
const tapOverlay = { position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", background: "rgba(12,10,22,.55)", border: 0, cursor: "pointer", borderRadius: 14 };
const lbl = { display: "block", fontSize: 12.5, color: C.muted, marginBottom: 6, letterSpacing: 0.3 };
const inp = { width: "100%", padding: "12px 14px", borderRadius: 12, background: C.panel2, border: "1px solid " + C.line, color: C.text, fontSize: 15, outline: "none" };
const primaryBtn = { display: "inline-flex", alignItems: "center", gap: 6, padding: "12px 16px", borderRadius: 12, background: "linear-gradient(135deg, " + C.accent + ", " + C.accent2 + ")", color: "#fff", border: 0, fontSize: 15, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap", boxShadow: "0 6px 18px rgba(139,109,255,.32)" };
const ctrlBtn = { width: 46, height: 46, borderRadius: 14, border: 0, cursor: "pointer", background: "linear-gradient(135deg, " + C.accent + ", " + C.accent2 + ")", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center" };
const ctrlBtnGhost = { width: 44, height: 44, borderRadius: 14, cursor: "pointer", background: C.panel2, border: "1px solid " + C.line, color: C.text, display: "flex", alignItems: "center", justifyContent: "center" };
const roomChip = { display: "inline-flex", alignItems: "center", gap: 8, marginTop: 3, padding: "5px 12px", borderRadius: 999, background: C.panel2, border: "1px solid " + C.line, color: C.text, fontSize: 15, cursor: "pointer" };
const avatar = { width: 30, height: 30, borderRadius: 999, background: "linear-gradient(135deg, " + C.accent2 + ", " + C.accent + ")", color: "#fff", fontSize: 11, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", border: "2px solid " + C.bg };
const queueRow = { display: "flex", alignItems: "center", gap: 10, padding: 8, borderRadius: 12, background: C.panel2, border: "1px solid " + C.line };
const rowX = { width: 30, height: 30, borderRadius: 9, flexShrink: 0, cursor: "pointer", background: "transparent", border: "1px solid " + C.line, color: C.muted, display: "flex", alignItems: "center", justifyContent: "center" };

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
